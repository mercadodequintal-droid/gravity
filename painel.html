<style>

.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid #26262b;font-size:12.5px}.kv span{color:var(--t2)}.kv b{font-weight:600;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:5px}.chips span{padding:4px 8px;border-radius:7px;background:var(--card2);font-size:11.5px}.chips span.on{background:rgba(245,197,24,.18);color:var(--gold2)}

@media(max-width:900px){.g3,.g2,.g4{grid-template-columns:1fr}.tabs{margin-left:0}}
</style></head><body>
<div id="app"><div class="login"><h1 style="font-family:Oswald;letter-spacing:8px;color:var(--gold2)">GRAVITY</h1><p>Painel do dono. Entre com a sua conta Google.</p><button class="btn" id="in">Entrar com Google</button><p id="msg" style="color:var(--warn)"></p></div></div>
<div id="drawer"></div>
<script src="js/vendor/firebase/firebase-app-compat.js"></script>
<script src="js/vendor/firebase/firebase-auth-compat.js"></script>
<script src="js/vendor/firebase/firebase-firestore-compat.js"></script>
<script>
// Painel do dono v2 (aprovado em 27/11, item 29). Lê stats/{uid} (resumo de uso + "x": treino detalhado, js/insights.js
// no app) e health/{uid} (saúde, corpo e pagamento — só de quem ligou "Compartilhar dados de saúde").
// A segurança é a regra do Firestore: só a conta do dono lê as coleções inteiras (docs/COWORK-REGRA-PAINEL.md).
firebase.initializeApp({ apiKey: 'AIzaSyCQ9vXmqoswdzpHjUy32XlH1rhjzhdo5Ww', authDomain: 'gravity-app-241d8.firebaseapp.com', projectId: 'gravity-app-241d8', appId: '1:966186252453:web:ba6b476625f56a13f8f54c' });
const auth = firebase.auth(), db = firebase.firestore(); const $ = (s) => document.querySelector(s);
const esc = (t) => String(t == null ? '' : t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const D = 864e5; let all = [], H = {}, me = null, tab = 'geral', q = '', fl = 'todos', F = { plan: '', dev: '', ver: '', sex: '', age: '' }, healthErr = '';
document.getElementById('in').onclick = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch((e) => { $('#msg').textContent = 'Não deu certo: ' + (e.code || e.message); });
auth.onAuthStateChanged(async (u) => {
  if (!u) return; me = u;
  try { const snap = await db.collection('stats').get(); all = snap.docs.map((d) => Object.assign({ uid: d.id }, d.data())); }
  catch (e) { document.getElementById('app').innerHTML = '<div class="login"><h1 style="font-family:Oswald;letter-spacing:6px;color:var(--gold2)">GRAVITY</h1><p>' + (e.code === 'permission-denied' ? 'Acesso negado para ' + esc(u.email) + '.' : 'Erro ao carregar: ' + esc(e.code || e.message)) + '</p></div>'; return; }
  try { const hs = await db.collection('health').get(); hs.docs.forEach((d) => { H[d.id] = d.data(); }); } catch (e) { healthErr = e.code === 'permission-denied' ? 'Saúde: falta a regra do Firestore para a coleção health (ver docs/COWORK-REGRA-PAINEL.md).' : ''; }
  render();
});
// ---------- utilidades ----------
const status = (r) => { const now = Date.now(); if (r.createdAt && now - r.createdAt < 7 * D) return 'n'; if (!r.lastWorkout) return 'p'; const d = (now - r.lastWorkout) / D; return d <= 7 ? 'a' : d <= 14 ? 's' : 'p'; };
const ST = { a: 'Ativo', n: 'Novo', s: 'Sumindo', p: 'Parado' };
const when = (t) => { if (!t) return '—'; const d = Math.floor((Date.now() - t) / D); const hm = new Date(t).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); return d < 1 && new Date(t).toDateString() === new Date().toDateString() ? 'hoje, ' + hm : d < 2 ? 'ontem, ' + hm : 'há ' + d + ' dias'; };
const dt = (t) => (t ? new Date(t).toLocaleDateString('pt-BR') : '—'), ddmm = (s) => (s ? s.split('-').reverse().slice(0, 2).join('/') : '—');
const pct = (n, t) => (t ? Math.round((n / t) * 100) : 0), nf = (v, d) => (v == null || isNaN(v) ? '—' : Number(v).toLocaleString('pt-BR', { maximumFractionDigits: d == null ? 1 : d }));
const avg = (l) => (l.length ? l.reduce((a, b) => a + b, 0) / l.length : null);
const hb = (list, fmt) => list.map(([k, v, t, lab]) => `<div class="hb"><span>${esc(k)}</span><i style="width:${Math.max(2, t ? Math.min(100, (v / t) * 100) : 0)}%"></i><em>${lab != null ? esc(lab) : fmt ? fmt(v) : pct(v, t) + '%'}</em></div>`).join('') || '<div class="note">Sem dados ainda.</div>';
const cnt = (L, f) => { const m = {}; L.forEach((r) => { [].concat(f(r) || []).forEach((k) => { if (k) m[k] = (m[k] || 0) + 1; }); }); return Object.entries(m).sort((a, b) => b[1] - a[1]); };
const dev = (r) => (/iPhone|iPad/.test(r.device || '') ? 'iPhone' : /Android/.test(r.device || '') ? 'Android' : 'Navegador');
const ageB = (a) => (!a ? '' : a < 25 ? 'até 24' : a < 35 ? '25–34' : a < 45 ? '35–44' : a < 60 ? '45–59' : '60+');
const X = (r) => r.x || {};
const active30 = (r) => r.lastWorkout && Date.now() - r.lastWorkout <= 30 * D, active7 = (r) => r.lastWorkout && Date.now() - r.lastWorkout <= 7 * D;
const REASON = { cansaco: 'Cansaço', trabalho: 'Trabalho', chuva: 'Chuva', dor: 'Dor', compromisso: 'Compromisso', doente: 'Doente', preguica: 'Preguiça mesmo', cachorro: 'Cachorro comeu', outra: 'Outra (escrita)', skip: 'Sem desculpa' };
const DOW = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
const KIND = { mensal: 'Mensalidade', wellhub: 'Wellhub', totalpass: 'TotalPass', outro: 'Outro' };
function rows() {
  return all.filter((r) => (fl === 'todos' || (fl === 'a7' ? active7(r) : fl === 'a30' ? active30(r) : status(r) === fl))
    && (!F.plan || r.plan === F.plan) && (!F.dev || dev(r) === F.dev) && (!F.ver || r.app === F.ver) && (!F.sex || (r.profile || {}).sex === F.sex) && (!F.age || ageB((r.profile || {}).age) === F.age));
}
const opts = (k, list, lab) => `<select data-fk="${k}"><option value="">${lab}</option>${list.map((v) => `<option ${F[k] === v ? 'selected' : ''} value="${esc(v)}">${esc(v)}</option>`).join('')}</select>`;
// ---------- telas ----------
function geral(R) {
  const now = Date.now(), N = R.length, a7 = R.filter(active7).length, a30 = R.filter(active30).length;
  const wk = R.reduce((a, r) => a + ((X(r).weeks || []).slice(-1)[0] || r.w7 || 0), 0), wkPrev = R.reduce((a, r) => a + ((X(r).weeks || []).slice(-2)[0] || 0), 0);
  const mins = avg(R.map((r) => X(r).avgMin).filter(Boolean)), sets = avg(R.map((r) => X(r).avgSets).filter(Boolean));
  const canc = R.reduce((a, r) => a + ((X(r).counters || {}).cancel || 0), 0), tot = R.reduce((a, r) => a + (r.workouts || 0), 0);
  const weeks = []; for (let i = 7; i >= 0; i--) { const end = now - i * 7 * D, start = end - 7 * D; weeks.push([new Date(start).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }), R.filter((r) => r.createdAt >= start && r.createdAt < end).length]); }
  const mx = Math.max(1, ...weeks.map((w) => w[1]));
  // retenção: grupo pela semana do cadastro; % com treino em cada semana seguinte (pelas 12 semanas do resumo)
  const coh = {}; R.forEach((r) => { if (!r.createdAt || !X(r).weeks) return; const age = Math.floor((now - r.createdAt) / (7 * D)); if (age > 11) return; const k = new Date(now - (age + 1) * 7 * D).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }); coh[k] = coh[k] || { age, us: [] }; coh[k].us.push(X(r).weeks); });
  const cols = 6, retH = Object.entries(coh).sort((a, b) => b[1].age - a[1].age).map(([k, c]) => `<span style="color:var(--t3)">${k}</span>` + Array.from({ length: cols }, (_, j) => { if (j > c.age) return '<span></span>'; const idx = 11 - c.age + j, p = pct(c.us.filter((w) => (w[idx] || 0) > 0).length, c.us.length); return `<span style="background:rgba(245,197,24,${0.15 + p / 130});${p > 70 ? 'color:#111' : ''}">${p}%</span>`; }).join('')).join('');
  const dowT = [0, 1, 2, 3, 4, 5, 6].map((i) => R.reduce((a, r) => a + ((X(r).dow || [])[i] || 0), 0)), dowS = dowT.reduce((a, b) => a + b, 0);
  const hrs = Array.from({ length: 24 }, (_, h) => R.reduce((a, r) => a + ((X(r).hours || [])[h] || 0), 0)), hm = Math.max(1, ...hrs);
  return `<div class="kpis"><div class="k"><small>Usuários</small><b>${N}</b><em>+${R.filter((r) => r.createdAt && now - r.createdAt < 7 * D).length} em 7 dias</em></div><div class="k"><small>Ativos 7 dias</small><b>${a7}</b><em>${pct(a7, N)}%</em></div><div class="k"><small>Ativos 30 dias</small><b>${a30}</b><em>${pct(a30, N)}%</em></div>
    <div class="k"><small>Treinos na semana</small><b>${wk}</b><em>${wkPrev ? (wk >= wkPrev ? '+' : '') + pct(wk - wkPrev, wkPrev) + '% vs. anterior' : '&nbsp;'}</em></div><div class="k"><small>Duração média</small><b>${mins ? Math.round(mins) + ' min' : '—'}</b><em>${sets ? nf(sets) + ' séries/treino' : '&nbsp;'}</em></div><div class="k"><small>Treinos cancelados</small><b>${canc}</b><em style="color:var(--bad)">${pct(canc, tot + canc)}% dos iniciados</em></div></div>
  <div class="cap">Crescimento e retenção</div><div class="g3"><div class="box"><h3>Cadastros por semana</h3><div class="bars">${weeks.map(([d, v]) => `<div><b>${v}</b><i style="height:${Math.max(3, (v / mx) * 100)}%"></i><span>${d}</span></div>`).join('')}</div></div>
   <div class="box"><h3>Retenção por semana de cadastro</h3><p class="d">% que treinou em cada semana depois do cadastro (S1 = semana do cadastro)</p><div class="ret" style="grid-template-columns:52px repeat(${cols},1fr)"><span></span>${Array.from({ length: cols }, (_, j) => `<span style="color:var(--t3)">S${j + 1}</span>`).join('')}${retH || '<span style="grid-column:1/-1;color:var(--t3)">Sem dados ainda</span>'}</div></div>
   <div class="box"><h3>Dias da semana</h3>${hb(dowT.map((v, i) => [DOW[i], v, dowS]))}</div></div>
  <div class="g2" style="margin-top:10px"><div class="box"><h3>Horário dos treinos</h3><div class="hr">${hrs.map((v) => `<i style="height:${(v / hm) * 100}%" title="${v}"></i>`).join('')}</div><div style="display:flex;justify-content:space-between;color:var(--t3);font-size:11px;margin-top:4px"><span>0h</span><span>6h</span><span>12h</span><span>18h</span><span>23h</span></div></div>
   <div class="box"><h3>Aparelho · versão · login</h3>${hb(cnt(R, dev).map(([k, v]) => [k, v, N]))}${hb(cnt(R, (r) => r.app).slice(0, 4).map(([k, v]) => ['v' + k, v, N]))}${hb(cnt(R, (r) => (r.provider === 'google' ? 'Google' : r.provider === 'email' ? 'E-mail' : '')).map(([k, v]) => [k, v, N]))}</div></div>`;
}
function usuarios(R) {
  const list = R.filter((r) => !q || ((r.name || '') + ' ' + (r.email || '')).toLowerCase().includes(q)).sort((a, b) => (b.lastWorkout || 0) - (a.lastWorkout || 0));
  const spk = (w) => `<div class="spk">${(w || []).slice(-8).map((v) => `<i style="height:${Math.min(100, v * 20)}%"></i>`).join('')}</div>`;
  return `<div class="flt">${[['todos', 'Todos'], ['a', 'Ativos'], ['n', 'Novos'], ['s', 'Sumindo'], ['p', 'Parados']].map(([k, l]) => `<span class="${fl === k ? 'on' : ''}" data-f="${k}">${l} ${k === 'todos' ? all.length : all.filter((r) => status(r) === k).length}</span>`).join('')}<input id="q" placeholder="Buscar nome ou e-mail" value="${esc(q)}"></div>
  <table><tr><th>Usuário</th><th>Situação</th><th class="hide-m">8 semanas</th><th>Treinos</th><th class="hide-m">Sequência</th><th class="hide-m">Nível</th><th class="hide-m">Plano</th><th class="hide-m">Versão</th><th>Último treino</th></tr>${list.map((r) => { const s = status(r), x = X(r); return `<tr class="cl" data-u="${r.uid}"><td>${esc(r.name || '—')} ${H[r.uid] ? '<span class="hlth">saúde</span>' : ''}<small>${esc(r.email)}</small></td><td><span class="st ${s}">${ST[s]}</span></td><td class="hide-m">${spk(x.weeks)}</td><td>${r.workouts || 0}</td><td class="hide-m">${x.streak != null ? x.streak + ' sem' : '—'}</td><td class="hide-m">${x.level || '—'}</td><td class="hide-m">${esc(r.plan || '—')}${r.planWeeks ? ' · ' + r.planWeek + '/' + r.planWeeks : ''}</td><td class="hide-m">${esc(r.app || '')}</td><td>${when(r.lastWorkout)}</td></tr>`; }).join('')}</table>
  <div class="note">Toque num usuário para ver a ficha completa. “saúde” = a pessoa autorizou compartilhar dados de saúde.</div>`;
}
function cruz(R) {
  const box = (t, d, inner, ins) => `<div class="box"><h3>${t}</h3><p class="d">${d}</p>${inner}${ins ? `<div class="ins">${ins}</div>` : ''}</div>`;
  const HR = R.filter((r) => H[r.uid]).map((r) => [r, H[r.uid]]);
  // sono × recordes
  const g = HR.reduce((a, [, h]) => { const c = h.checkin || {}; a.gn += (c.good || [])[0] || 0; a.gr += (c.good || [])[1] || 0; a.bn += (c.bad || [])[0] || 0; a.br += (c.bad || [])[1] || 0; return a; }, { gn: 0, gr: 0, bn: 0, br: 0 });
  const rg = g.gn ? g.gr / g.gn : null, rb = g.bn ? g.br / g.bn : null;
